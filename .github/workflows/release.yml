name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<version from plugin.json>)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Package plugin
        id: package
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./plugin.json').version")"
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v${VERSION}"; fi
          NAME="decky-gameartwork"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$NAME"
          cp plugin.json package.json main.py README.md LICENSE "$STAGE/$NAME/"
          # Only runtime files belong in the release: sourcemaps and typings
          # are build leftovers and would triple the download size.
          rsync -a --exclude '*.map' --exclude '*.d.ts' dist/ "$STAGE/$NAME/dist/"
          # Decky Loader mounts the plugin's defaults/ and py_modules/ into the
          # installed tree, so the bundled python module has to travel with it.
          if [ -d defaults ]; then cp -r defaults/. "$STAGE/$NAME/"; fi
          if [ -d py_modules ]; then cp -r py_modules "$STAGE/$NAME/py_modules"; fi
          test -f "$STAGE/$NAME/plugin.json"
          test -f "$STAGE/$NAME/dist/index.js"
          ( cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/GameArtwork-${VERSION}.zip" "$NAME" )
          rm -rf "$STAGE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: GameArtwork ${{ steps.package.outputs.tag }}
          files: GameArtwork-${{ steps.package.outputs.version }}.zip
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          draft: false
          body: |
            Decky Loader plugin that cross-searches game artwork across
            **SteamGridDB, Steam, Epic Games Store, GOG, IGDB** and **VNDB**.
            Extended fork of [SteamGridDB/decky-steamgriddb](https://github.com/SteamGridDB/decky-steamgriddb).

            ## Install
            1. Install [Decky Loader](https://wiki.deckbrew.xyz/en/user-guide/install).
            2. Open Quick Access → Decky → Settings → Developer → **Install from URL**.
            3. Paste the download URL of the `GameArtwork-<version>.zip` asset below.
